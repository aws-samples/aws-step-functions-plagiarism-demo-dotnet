QueryLanguage: JSONata
StartAt: Create new incident
Comment: >-
  Plagiarism state machine manages the process for student's plagiarism
  violation.
States:
  Create new incident:
    Type: Pass
    Output:
      StudentId: "{% $states.input.StudentId %}"
      IncidentDate: "{% $states.input.IncidentDate %}"
      IncidentId: "{% $uuid() %}"
      IncidentResolved: false
      AdminActionRequired: false
    Next: Save incident

  Save incident:
    Type: Task
    Resource: arn:aws:states:::dynamodb:putItem
    Arguments:
      TableName: ${IncidentsTable}
      Item:
        StudentId:
          S: "{% $states.input.StudentId %}"
        IncidentDate:
          S: "{% $states.input.IncidentDate %}"
        IncidentId:
          S: "{% $states.input.IncidentId %}"
        IncidentResolved:
          BOOL: "{% $states.input.IncidentResolved %}"
        AdminActionRequired:
          BOOL: "{% $states.input.AdminActionRequired %}"
    # Discard the DynamoDB response and pass the incident through unchanged
    Output: "{% $states.input %}"
    Next: Schedule exam

  Schedule exam:
    Type: Task
    Comment: Set the next exam deadline for the student to complete the exam.
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${ScheduleExamFunctionArn}
      Payload: "{% $states.input %}"
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    # Unwrap the Lambda invocation envelope so downstream states see the incident
    Output: "{% $states.result.Payload %}"
    Catch:
      - ErrorEquals:
          - StudentExceededAllowableExamRetries
        # Preserve the incident and attach the error details
        Output: "{% $merge([$states.input, {'Error': $states.errorOutput}]) %}"
        Next: Take administrative action
    Next: Notify student

  Notify student:
    Type: Task
    Resource: "arn:aws:states:::sns:publish.waitForTaskToken"
    Comment: >-
      Notifies the student of the exam requirement and waits for the exam to be
      submitted. If the exam deadline (7 days) passes without a submission,
      administrative action is taken.
    TimeoutSeconds: 604800
    Arguments:
      TopicArn: '${NotificationTopic}'
      Message: "{% '${TestingCentreUrl}/?IncidentId=' & $states.input.IncidentId & '&ExamId=' & $states.input.Exams[0].ExamId & '&TaskToken=' & $states.context.Task.Token %}"
    Catch:
      - ErrorEquals:
          - States.Timeout
        # Preserve the incident and attach the error details
        Output: "{% $merge([$states.input, {'Error': $states.errorOutput}]) %}"
        Next: Take administrative action
    Next: Has student passed exam?

  Has student passed exam?:
    Type: Choice
    Comment: If the student has a score less than 67, they need to reschedule
    Choices:
      - Condition: "{% $states.input.Exams[0].Result = 0 %}"
        Next: Resolve incident
      - Condition: "{% $states.input.Exams[0].Result = 1 %}"
        Next: Schedule exam
      - Condition: "{% $states.input.Exams[0].Result = 2 %}"
        Next: Take administrative action
    Default: Take administrative action

  Take administrative action:
    Type: Task
    Comment: >-
      Take administrative action if student does not sit exam or fails all three
      attempts.
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${TakeAdministrativeActionFunctionArn}
      Payload: "{% $states.input %}"
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    End: true

  Resolve incident:
    Type: Task
    Comment: Resolves the incident for the student.
    Resource: arn:aws:states:::lambda:invoke
    Arguments:
      FunctionName: ${ResolveIncidentFunctionArn}
      Payload: "{% $states.input %}"
    Retry:
      - ErrorEquals:
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - Lambda.TooManyRequestsException
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
    End: true
